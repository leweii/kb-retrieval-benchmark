``\n\nThe new code for the my question is:\n```\nasync function randomString() {\n  const response = await fetch('https://random-word-api.herokuapp.com/word?lang=it');\n  const work = await response.json();\n  console.log(work);\n  textInput.value = work;\n}\n\nrandomButton.addEventListener('click', function() {\n  randomString();\n});\n```", "question_en": "Problem generating causal sentences with js [closed]\n\nI am creating a sentence translation app, but I have a problem with the generation of causal sentences. I have to generate the sentences with an external url, but in my code instead of generating me a whole sentence, it only generates one character. Can you help me understand where I am going wrong?\n\n```\n<main>\n  <section class=\"panel translation\">\n    <div class=\"translation-flag\"></div>\n    <button class=\"favorites\">⭐</button>\n    <div class=\"translation-result\">\n      <p class=\"translation-text\">Traduzione</p>\n    </div>\n  </section>\n\n  <section class=\"panel controls\">\n    <input class=\"text-input\" type=\"text\" placeholder=\"inserisci il testo da tradurre\">\n    \n    <button class=\"lang-button\" data-lang=\"en\">🇬🇧</button>\n    <button class=\"lang-button\" data-lang=\"fr\">🇫🇷</button>\n    <button class=\"lang-button\" data-lang=\"es\">🇪🇸</button>\n    <button class=\"reset-button\">❌</button>\n    <button class=\"random-button\">\n      <i class=\"fa-solid fa-dice icon-dice\"></i>\n    </button>\n  </section>\n\n  <div class=\"panel translate\">\n    <h1>Le tue parole preferite</h1>\n   <ul class=\"translate-favorites\">\n    \n   </ul> \n\n    </p>\n  </div>\n</main>\n\n\n\n const langButtons = document.querySelectorAll('.lang-button');\nconst textInput = document.querySelector('.text-input');\nconst translationText = document.querySelector('.translation-text');\nconst translationFlag = document.querySelector('.translation-flag');\nconst resetButton = document.querySelector('.reset-button');\nconst randomButton = document.querySelector('.random-button');\n\n\n//Funzione per aggiornare la lista delle traduzioni preferite\nfunction updateFavoriteList(translation) {\n  const translateFavorite = document.querySelector('.translate-favorites');\n  translateFavorite.innerHTML = '';\n    translation.forEach(function(translateTexts) {\n      const li = document.createElement('li');\n      li.textContent = translateTexts;\n      translateFavorite.appendChild(li);\n    });\n}\n\nasync function translate(text, lang, flag) {\n  const url = `https://api.mymemory.translated.net/get?q=${text}&langpair=it|${lang}`;\n  const response = await fetch(url);\n  const jsonData = await response.json();\n  const result = jsonData.responseData.translatedText;\n  console.log(result);\n\n  translationText.innerText = result;\n  translationFlag.innerText = flag;\n}\n\nlangButtons.forEach(function(langButton) {\n  langButton.addEventListener('click', function() {\n\n    // recupero il testo dal campo di input e rimuovo eventuali spazi extra\n    // all'inizio e alla fine della stringa inserita con il metodo .trim()\n    // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/trim\n    const text = textInput.value.trim();\n\n    // recupero il codice lingua dal data-attribute del pulsante\n    const lang = langButton.dataset.lang;\n    // recupero la bandierina dalla testo del pulsante\n    const flag = langButton.innerText;\n\n    // se il campo di input ha effettvamente del testo\n    // invoco la funzione e faccio partire la chiamata alle API\n    if(text.length > 0) {\n      translate(text, lang, flag);\n    }\n  });\n});\n\nrandomButton.addEventListener('click', function() {\n  const randomUrls = 'https://random-word-api.herokuapp.com/word?length=5';\n  const randomIndex = Math.floor(Math.random() * randomUrls.length);\n  const randomWork = randomUrls[randomIndex];\n  console.log(randomWork);\n  textInput.value = randomWork;\n});\n\n\n\nresetButton.addEventListener('click', reset);\n```\n\nThe new code for the my question is:\n```\nasync function randomString() {\n  const response = await fetch('https://random-word-api.herokuapp.com/word?lang=it');\n  const work = await response.json();\n  console.log(work);\n  textInput.value = work;\n}\n\nrandomButton.addEventListener('click', function() {\n  randomString();\n});\n```", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 345, "qid": "bright_ans-c022571bda", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "我想计算自定义大小的高斯网格(Gaussian Grid)的纬度值,但没有找到相关的方法或公式。在哪里可以找到这方面的信息?或者,有没有公开可用的函数可以完成这项工作?", "question_en": "I would like to calculate the latitude values of a Gaussian Grid of a size of my choosing. Unfortunately, I didn't find a method or a formula to do so. Where can I find this information? Alternatively, is there a function publicly available that can do the job?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 346, "qid": "bright_ans-c0ef210b17", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "How to use ros2_control with actual hardware communicating via etherCAT?\n\nI am learning ros2_control with the real hardware. I need some help writing hardware interface for the current setup. I do not have experience writing on the communication side of the real hardware.\n\nsetup: I have Jetson nano, drives, motors, and sensors communicating via EtherCAT and using ros2 foxy and SOEM_ROS2 package. these were installed and running without ros2 control, simply via publisher and subscriber. The whole system controls the x,y,z axis with prismatic joint. It is not a robot. so no end effector. Now, I want to integrate ros2 control with the whole system. I don't know how to get the values from the hardware for the read and write methods of the hardware interface. I appreciate any help you can provide.", "question_en": "How to use ros2_control with actual hardware communicating via etherCAT?\n\nI am learning ros2_control with the real hardware. I need some help writing hardware interface for the current setup. I do not have experience writing on the communication side of the real hardware.\n\nsetup: I have Jetson nano, drives, motors, and sensors communicating via EtherCAT and using ros2 foxy and SOEM_ROS2 package. these were installed and running without ros2 control, simply via publisher and subscriber. The whole system controls the x,y,z axis with prismatic joint. It is not a robot. so no end effector. Now, I want to integrate ros2 control with the whole system. I don't know how to get the values from the hardware for the read and write methods of the hardware interface. I appreciate any help you can provide.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 347, "qid": "bright_ans-c60ef28382", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "为什么 Germany 在 20 世纪 70/80 年代没有遭受大通胀(Great Inflation)的影响?\n\n对比一些工业国家在 1975 年前后(大通胀时期,介于 1973 年和 1979/80 年两次石油危机之间)的通货膨胀率,可以发现很奇怪:大多数国家的通胀率非常高,约为 22%,而 Germany 似乎并没有经历如此高的通胀率(最高只有 7%,与其他国家相比相当低)。\n\n这是为什么呢?有什么原因吗,比如是因为 Germany 在 1973 年退出了 Bretton Woods System(布雷顿森林体系)?有哪些合理的解释?", "question_en": "Why did Germany not suffer from Great Inflation in the 1970s/80s?\n\nComparing the inflation rate of some of the industrial countries around 1975 (Great Inflation) in between the two oil shocks of 1973 and 1979/80, it seems odd that most countries' inflation rate was very high at around 22%, whereas Germany does not seem to have suffered from such a high rate (at most 7% which is quite low compared to the others)\n\nWhy is that? Are there any reasons for that, f.ex. due to Germany leaving the Bretton Woods System in 1973? What are some reasonable explanations?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 348, "qid": "bright_ans-c730631da9", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Is there research to prove that humans achieve more when challenging ourselves or when we challenge others?\n\nGiven that there is a single player game, let's say, Tetris. I play the game for 5 days and my friend is also playing the game for 5 days. At the end of the 5 days we would like to see who has the highest score and that person wins some prize.\n\nIs it better that we see the scores of our opponent and try to better it, or is better that I do not see my friend's score and focus on just constantly beating my own score?\n\nWhich of the 2 scenarios is likely to yield the higher score at the end of the 5 days? And why?\n\nI'm doing some research on gamification and how competition can help us progress a skill.", "question_en": "Is there research to prove that humans achieve more when challenging ourselves or when we challenge others?\n\nGiven that there is a single player game, let's say, Tetris. I play the game for 5 days and my friend is also playing the game for 5 days. At the end of the 5 days we would like to see who has the highest score and that person wins some prize.\n\nIs it better that we see the scores of our opponent and try to better it, or is better that I do not see my friend's score and focus on just constantly beating my own score?\n\nWhich of the 2 scenarios is likely to yield the higher score at the end of the 5 days? And why?\n\nI'm doing some research on gamification and how competition can help us progress a skill.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 349, "qid": "bright_ans-caa0b5a4f4", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "在思考当今各大陆是如何从超大陆演化而来时，这显然是一个渐进的过程，但地球上一定存在某些曾经连在一起、并且是最“后”从 Pangea 分裂开来的区域。\n\n我们知道这些裂谷作用/分裂事件发生在什么时候、什么地方吗？", "question_en": "When thinking about the formation of the current continents from a super-continent, it's clear that this is a gradual process, but there must be certain areas on earth which were once joined and were the \"last\" to break apart from Pangea.\n\nDo we know when and where these rifting / break-up events took place?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 4, "exclude_reason": ""}, {"no": 350, "qid": "bright_ans-d2d353f081", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "树木是如何通过“Wood Wide Web”进行交流的?\n我在 The New Yorker 的文章 The Secrets of the Wood Wide Web 中读到,树木会通过根部传递电脉冲来相互交流。借助这些脉冲,如果某种养分摄入不足,它们可以向其他树木索取,也可以提醒其他树木即将发生虫害。这种现象被称为“Wood Wide Web”。\n那么,树木连大脑都没有,它们是如何区分接收到的不同类型的脉冲的呢?这个过程与动物的神经系统有相似之处吗?\n补充的 YouTube 视频:Trees can talk to each other, but how?", "question_en": "How do trees communicate in the \"Wood Wide Web\"?\nI read on The New Yorker - The Secrets of the Wood Wide Web that trees communicate with each other through electrical impulses sent through their roots. Through these impulses they can ask other trees for some nutrient if they are getting it in insufficient amount or warn the other trees about an upcoming pest attack. This phenomenon is termed as the Wood Wide Web.\nSo how do trees distinguish in different types of impulses that they receive if they don't even have a brain? And does this process show any resemblance to nervous system in animals?\nAdditional YouTube video: Trees can talk to each other, but how?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 351, "qid": "bright_ans-d47dd06813", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "我应该如何收集雨水并将其转化为饮用水?\n\n我想把现有的屋顶排水沟系统改造成一套雨水收集和循环利用系统。目前这些水只是作为径流直接流入雨水管网,给我所在城市本就老化且不堪重负的基础设施增加了更多负担。\n\n有没有办法收集这些水,通过自然方式进行过滤,并以可持续的方式循环利用?", "question_en": "How should I collect and convert rain water into drinking water?\n\nI would like to convert my current rain gutter system into a collection and recycling process. Currently the water is just runoff and ends up in the storm sewer creating more work for my cities aging and already overburdened infrastructure.\n\nIs there a way that I can collect this water, filter it naturally, and recycle the water in a sustainable way?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 352, "qid": "bright_ans-daca8603ba", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "What is the environmental impact of meal kit subscriptions (Blue Apron, etc)?\n\nAccording to Wikipedia, a meal-kit is...\n\n...a subscription service that sends customers pre-portioned food ingredients and recipes for them to prepare homecooked meals.\n\nWell-known examples include Blue Apron, Hello Fresh, and Green Chef. These kits include single meal portions of meats, produce, and seasonings, typically assuming that customers will only have at home such basics as oil, salt, and water.\n\nOne claimed advantage to such services is reduced food waste -- each kit contains the exact amount of all perishable ingredients needed for the recipe, meaning there's no excess produce to spoil once the meal is made.\n\nHowever, the entire thing requires boxes, ice packs, and plastic packaging -- not all of which is recyclable.\n\nFor now, let's ignore the question of home delivery vs going to stores. My question is:\n\nDo meal-kits reduce total food waste?\nDo meal-kits increase the amount of packaging waste produced per meal?\nFinally, is the (assumed) reduced food waste enough to offset the (assumed) increase in packaging?", "question_en": "What is the environmental impact of meal kit subscriptions (Blue Apron, etc)?\n\nAccording to Wikipedia, a meal-kit is...\n\n...a subscription service that sends customers pre-portioned food ingredients and recipes for them to prepare homecooked meals.\n\nWell-known examples include Blue Apron, Hello Fresh, and Green Chef. These kits include single meal portions of meats, produce, and seasonings, typically assuming that customers will only have at home such basics as oil, salt, and water.\n\nOne claimed advantage to such services is reduced food waste -- each kit contains the exact amount of all perishable ingredients needed for the recipe, meaning there's no excess produce to spoil once the meal is made.\n\nHowever, the entire thing requires boxes, ice packs, and plastic packaging -- not all of which is recyclable.\n\nFor now, let's ignore the question of home delivery vs going to stores. My question is:\n\nDo meal-kits reduce total food waste?\nDo meal-kits increase the amount of packaging waste produced per meal?\nFinally, is the (assumed) reduced food waste enough to offset the (assumed) increase in packaging?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 353, "qid": "bright_ans-dcbe053e9a", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "Python 类型提示：对于可以是任意可迭代序列的变量，应该使用什么类型提示？\n\n```\ndef mysum(x)->int:\n    s = 0\n    for i in x:\n        s += i\n    return s\n```\n\n参数 x 可以是 list[int] 或 set[int]，也可以是 d.keys()（其中 d 是一个 dict），还可以是 range(10)，以及其他许多元素类型为 int 的序列。x 正确的类型提示应该是什么？", "question_en": "Python type hints: what should I use for a variable that can be any iterable sequence?\n\n```\ndef mysum(x)->int:\n    s = 0\n    for i in x:\n        s += i\n    return s\n```\n\nThe argument x can be list[int] or set[int], it can also be d.keys() where d is a dict, it can be range(10), as well as possibly many other sequences, where the item is of type int. What is the correct type-hint for x?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 2, "exclude_reason": ""}, {"no": 354, "qid": "bright_ans-dd21159f70", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "DAX RLS Function 使用 LOOKUPVALUE Parsing 通过但无法正常工作\n\nI'm 尝试在一个表上实现 RLS,并使用另一个辅助表来完成,结构如下:\n\nEmployeeTable\n```\nEmployeeID        EmployeeEmail\n1        1234@email.com\n2        4567@email.com\n```\n\nFilterTable\n```\nEmployeeID        ManagerHierarchy\n1        3&4&5\n2        6&7&4&5\n```\n\nManagerHierarchy 列是一个字符串,显示某位员工的所有上级经理,并用 \"&\" 连接在一起。\n\nRLS 的目标是创建一个筛选条件,允许任何经理查看报表,并且其数据中只显示那些 employeeID 的记录:即该经理自己的 ID 存在于 ManagerHierarchy 列中,从而只显示他们的下属。\n\n我在 EmployeeTable 上应用了下面的 DAX 表达式,原以为可行,它在表达式编辑器中可以通过解析,但运行时却报错:\n```\n[EmplID]=\nLOOKUPVALUE(\nFilterTable[EmployeeID], FilterTable[ManagerHIERARCHY],\n\nLOOKUPVALUE( //This is to return the viewer's own employeeID to be crossed over into the FilterTable\n[EmployeeID], [EmployeeEmail], USERPRINCIPALNAME())\n)\n```\n\nThe Report 给出的内容如下:\n\nAn error was encoutnered during the evaluation of the row level security defined on EmployeeTable. Function 'LOOKUPVALUE' does not support values of type Text with values of type integer. Consider using the VALUE or FORMAT function to convert one of the values.\n\n我已经尝试调整 DAX 表达式的写法来进行类型转换,但仍然没能达到预期效果。", "question_en": "DAX RLS Function using LOOKUPVALUE Parsing but not working\n\nI have a table that I'm trying to implement RLS on using a secondary table with a structure below:\n\nEmployeeTable\n```\nEmployeeID        EmployeeEmail\n1        1234@email.com\n2        4567@email.com\n```\n\nFilterTable\n```\nEmployeeID        ManagerHierarchy\n1        3&4&5\n2        6&7&4&5\n```\n\nThe ManagerHierarchy column is a string that shows all managers of an employee concatenated together and separated by \"&\".\n\nThe goal of the RLS is to create a filter that allows any manager to view the report and have their data only display employeeIDs wherein their own ID exists within the ManagerHierarchy column and thus only showing their subordinates.\n\nI have the below DAX expression applied on EmployeeTable that I thought would work and parses in the expression builder, but it is giving me errors:\n```\n[EmplID]=\nLOOKUPVALUE(\nFilterTable[EmployeeID], FilterTable[ManagerHIERARCHY],\n\nLOOKUPVALUE( //This is to return the viewer's own employeeID to be crossed over into the FilterTable\n[EmployeeID], [EmployeeEmail], USERPRINCIPALNAME())\n)\n```\n\nThe Report it gives is as follows:\n\nAn error was encoutnered during the evaluation of the row level security defined on EmployeeTable. Function 'LOOKUPVALUE' does not support values of type Text with values of type integer. Consider using the VALUE or FORMAT function to convert one of the values.\n\nI've tried re-shuffling my DAX expression with to convert it as such, but I haven't been able to make it work as intended.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 355, "qid": "bright_ans-ded6a4a8a4", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "Kohlberg 的道德推理理论是怎么运作的？我可以自己测量吗？\n\n有没有什么办法可以推断出 Kohlberg 会认为我处于哪个阶段？\n\n在思考什么是最好的、什么是可允许的等问题时，我确实会参考法律、别人的意见、惩罚等等，但我不会把它们当作判断对错的决定性依据，只是把它们当作我自己做出判断时的一个考虑方面。而且，虽然我认为我实际做出的判断适用于任何人，而不只是我自己，但这些判断也是暂时的，可以被修正和重新评估。\n\n当然也有一些例外：\n\n我自己的幸福往往比别人的更有价值，也许只是因为我特别适合去经营自己的幸福。同样，我也没有义务出于任何理由牺牲自己，比如为了拯救一百万人的生命，不过我对任何人都会这么说。另外，有些行为对任何人来说都始终且毫无疑问是错误的，因为它们太令人发指了。\n\n我对道德思考得足够多，也足够随意，所以我觉得 I'm 大概处于后习俗水平，也许这才是真正重要的。但我想知道能不能了解得更多！", "question_en": "How does Kohlberg's moral reasoning work, can I measure it myself?\n\nIs there any way I can work out what stage Kohlberg would claim I was operating at?\n\nI do refer, when thinking about what is best, permissible, etc., to laws and other people's opinions, punishment etc., but not as conclusive judgments on what is right or wrong etc., only as one aspect of how to try to make that judgment myself. And while my actual judgments I would claim apply to anyone, not just myself, they are also provisional, and subject to revision, reappraisal.\n\nWith some exceptions:\n\nMy happiness is often more valuable than other's, maybe just because I'm especially well set to work on that. Likewise I wouldn't be obliged to martyr myself for any reason, e.g. to save a million lives, though I would say the same of anyone. And certain actions are always and unequivocally wrong, for anyone, they are that heinous.\n\nI think enough and loosely enough about morality to say that I'm probably post conventional, and perhaps that's all that really does matter. But I wondered if I could learn more!", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 356, "qid": "bright_ans-df686af087", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "What causes adenosine build up in the brain when awake?\nAdenosine is an important hormone in sleep regulation. It is postulated that when a person is awake, there is a build up of adenosine in the brain, which inhibits the neurons in the brain, and produces tiredness. (See answer for more information: What causes humans to be sleepy?)\nHowever, I am wondering what specifically causes this adenosine build up. I understand ATP (adenosine tri-phosphate) is broken down to ADP in the brain to produce energy. I thought this ADP would then be used to re-generate ATP again etc, so I'm not sure how adenosine is built up in the brain over a day.\nBasically I am unsure how Adenosine itself, as opposed to ATP or ADP, is produced during the waking state?\nMy theory is that during the high demand waking state there is insufficient energy to convert ADP back to ATP, and the excess ADP is broken down to adenosine somehow.\nI would appreciate an explanation of how this build up occurs, and also an explanation of how this in turn how it induces sleepiness would be a plus.", "question_en": "What causes adenosine build up in the brain when awake?\nAdenosine is an important hormone in sleep regulation. It is postulated that when a person is awake, there is a build up of adenosine in the brain, which inhibits the neurons in the brain, and produces tiredness. (See answer for more information: What causes humans to be sleepy?)\nHowever, I am wondering what specifically causes this adenosine build up. I understand ATP (adenosine tri-phosphate) is broken down to ADP in the brain to produce energy. I thought this ADP would then be used to re-generate ATP again etc, so I'm not sure how adenosine is built up in the brain over a day.\nBasically I am unsure how Adenosine itself, as opposed to ATP or ADP, is produced during the waking state?\nMy theory is that during the high demand waking state there is insufficient energy to convert ADP back to ATP, and the excess ADP is broken down to adenosine somehow.\nI would appreciate an explanation of how this build up occurs, and also an explanation of how this in turn how it induces sleepiness would be a plus.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 357, "qid": "bright_ans-e75981d540", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "Taiga 是 Russian 用来指高纬度地区大片森林荒野的词。那山地的森林呢?山区中位于树线以下的森林地带叫什么名字?", "question_en": "Taiga is the Russian word for big areas of forest wilderness in high latitude regions. What about forests in the mountains? What is the name for the forested areas in mountains which are below the treeline?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 2, "exclude_reason": ""}, {"no": 358, "qid": "bright_ans-eb9d75519f", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "有没有具有严格微观基础的行为宏观模型?\n\n我在找一些试图为行为 New Keynesian(或任何其他)宏观模型建立严格微观基础的论文。\n\n这出乎意料地困难,关于这个主题的大多数研究(比如 De Grauwe 2012)一开始就直接设定 IS 曲线和 LM 曲线,然后在此基础上加入某种理性与行为主体(主要是具有非理性预期的主体)的混合。然而,我找不到任何一篇论文能为这类模型提供完整而严格的微观基础(即从这些理性主体和行为主体跨期的微观行为中推导出 IS 和 LM)。\n\n这当然很困难,因为没有理性预期的话宏观模型很难求解,但另一方面,我也很难相信这个问题会被研究者们忽视。\n\n因此,我的问题是:有没有论文为行为宏观模型建立了严格的微观基础?", "question_en": "Are there any behavioral macro models with rigorous micro-foundations?\n\nI am looking for some paper that tries to establish rigorous micro-foundations the behavioral New Keynesian (or any other) macro models.\n\nThis is surprisingly hard, most work on this topic (like De Grauwe 2012), simply starts already by setting up IS and LM curves and adding some sort of mix of rational and behavioral agents (mostly agents with non-rational expectations) on top of it. However, I can't find any paper that would provide full rigorous micro-foundations for such model (i.e. deriving IS and LM from the micro behavior of these rational and behavioral agents across time).\n\nThis is of course difficult, as without the rational expectations it is difficult to solve macro models, but on other hand it is hard to believe this issue would be ignored by the practitioners.\n\nConsequently, my question is: are there any papers that establish rigorous micro-foundations for behavioral macro models?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 359, "qid": "bright_ans-ee92683e32", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "I have recently bought a medium sized plot of wood/scrub land. Half of this plot was once used to dump shale from coal mines, which means I have a lot of shale.\r\n\r\nI have been wondering/looking for possible uses for the stuff. One thought I've had is to make \"mud bricks\" however I can't find any mention of whether it is possible or not. I know the traditional method uses loamy soil but would it work with shale?\r\n\r\nI don't have a kiln or any way of baking the bricks, so would be reliant on the sun. I was thinking maybe adding water and maybe some loam?\r\n\r\nAside: there are no suitable tags for my question and I do not have the reputation to add any, I'm thinking I could be on the wrong site for this question, if I am, please advise me of a more suitable one.", "question_en": "I have recently bought a medium sized plot of wood/scrub land. Half of this plot was once used to dump shale from coal mines, which means I have a lot of shale.\r\n\r\nI have been wondering/looking for possible uses for the stuff. One thought I've had is to make \"mud bricks\" however I can't find any mention of whether it is possible or not. I know the traditional method uses loamy soil but would it work with shale?\r\n\r\nI don't have a kiln or any way of baking the bricks, so would be reliant on the sun. I was thinking maybe adding water and maybe some loam?\r\n\r\nAside: there are no suitable tags for my question and I do not have the reputation to add any, I'm thinking I could be on the wrong site for this question, if I am, please advise me of a more suitable one.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 360, "qid": "bright_ans-efa6b8832b", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Could Gaza have been \"one of the wealthiest states on the Mediterranean\"?\n\nAccording to this transcript, (I don't have access to the original interview), Robert Kennedy told Krystal Ball:\n\nThe international aid agencies have given Hamas, have given Gaza more than 10 times per capita what we gave to rebuild all of Europe after the Marshall Plan. 8,300 dollars per capita, every person in Gaza. We rebuilt Europe with $621 per capita in Europe, and we rebuilt it. What did they do with that money? Instead of using it to make this, you know, Gaza this beautiful country with white sand beaches. It should be a paradise...They take virtually all the money and they steal it...It’s not Israel’s fault that Gaza is poverty-stricken. Gaza should be one of the wealthiest states on the Mediterranean.\n\nIf Gaza truly received US$8,300 per capita in international aid over time, would that indeed have made it - barring diversion of funds for non-rebuilding purposes - one of the wealthiest states on the Mediterranean? (I realize Gaza does not have independent statehood, and I'm assuming Kennedy's intent was that if it were a state it would be from the wealthiest.)", "question_en": "Could Gaza have been \"one of the wealthiest states on the Mediterranean\"?\n\nAccording to this transcript, (I don't have access to the original interview), Robert Kennedy told Krystal Ball:\n\nThe international aid agencies have given Hamas, have given Gaza more than 10 times per capita what we gave to rebuild all of Europe after the Marshall Plan. 8,300 dollars per capita, every person in Gaza. We rebuilt Europe with $621 per capita in Europe, and we rebuilt it. What did they do with that money? Instead of using it to make this, you know, Gaza this beautiful country with white sand beaches. It should be a paradise...They take virtually all the money and they steal it...It’s not Israel’s fault that Gaza is poverty-stricken. Gaza should be one of the wealthiest states on the Mediterranean.\n\nIf Gaza truly received US$8,300 per capita in international aid over time, would that indeed have made it - barring diversion of funds for non-rebuilding purposes - one of the wealthiest states on the Mediterranean? (I realize Gaza does not have independent statehood, and I'm assuming Kennedy's intent was that if it were a state it would be from the wealthiest.)", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 361, "qid": "bright_ans-f0019bfe23", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "父组件更新后，子组件没有重新渲染\n\n我有 1 个父组件（Container）和 2 个子组件（List、SelectedItem）。Initially 我把所有数据渲染到 Container 中，并把全部数据传给 List，把第一个项目作为 selectedItem 传给 SelectedItem 组件。到这里为止一切正常。\n\n当用户点击 List 组件中的某个项目时，它会通过一个函数更新 Parent 的 selected item，Parent 能够更新 state，But 它并没有重新渲染 SelectedItem 组件。\n\nList Component:\n```\n import \"./SelectedImage.css\"\n\nfunction ListSection({items, updateSelectedItem}) {\n  return (\n    <div className=\"list-section\">\n      <ul>\n        {\n          (items).map((item) => {\n            return <li key={item.id} onClick={() => updateSelectedItem(item.id)}>{item.name}</li>\n          })\n        }\n      </ul>\n    </div>\n  );\n}\n\nexport default ListSection;\n```\n\nContainer Component\n```\nimport LeftSection from './LeftSection';\nimport logo from './logo.svg';\nimport RightSection from './RightSection ';\nimport SelectedItem from './SelectedItem';\nimport \"./App.css\";\nimport ListSection from './ListSection';\nimport { Component, useState } from 'react';\n\nconst products = [\n  {id: 1, name: \"Lime\", size: [\"large\", \"medium\", \"small\"], category: \"Juice\", image: \"lime-juice.jpg\"},\n  {id: 2, name: \"Orange\", size: [\"large\", \"medium\", \"small\"], category: \"Juice\", image: \"orange-juice.jpg\"},\n  {id: 3, name: \"Mango\", size: [\"large\", \"medium\", \"small\"], category: \"Juice\", image: \"mango-juice.jpg\"},\n]\n\nfunction Container() {\n  let [selectItem, setSelectItem] = useState(products[0]);\n\n  function chooseSelectedItem(id) {\n    let item = products.filter((value) => {\n      console.log(value.id);\n      return (value.id == id)\n    })\n    setSelectItem(item[0]);\n    console.log(item[0]);\n  }\n\n  return (\n    <div className=\"Container\">\n      <ListSection items={products} updateSelectedItem={chooseSelectedItem}/>\n      <SelectedItem CurrentSelectedItem={selectItem}/>\n    </div>\n  );\n}\n\nexport default Container;\n```\n\nSelectedItemComponent\n\n```\nimport QuantityBar from \"./QuantityBar\";\nimport \"./SelectedImage.css\"\nimport { useState } from \"react\";\n\nfunction SelectedItem({CurrentSelectedItem}) {\n  let [item, setItem] = useState(CurrentSelectedItem);  \n\n  return (\n    <div className=\"selected-item\">\n      {/* <img src={item.image} className=\"selected-image\" /> */}\n      {item.name}\n      {/* <QuantityBar itemCount={0} /> */}\n    </div>\n  );\n}\n\nexport default SelectedItem;\n```", "question_en": "Child component not re-rendering after parent component gets updated\n\nI have 1 parent(Container) and 2 (List, SelectedItem) child components, Initially I render all data to Container and send all data to list and first item as selectedItem to selected Item component. So ar so good\n\nWhen a user clicks an item in the List component, it updates the selected item of the Parent through a function, the parent is able to update state, But it is not re-rendering selected item component.\n\nList Component:\n```\n import \"./SelectedImage.css\"\n\nfunction ListSection({items, updateSelectedItem}) {\n  return (\n    <div className=\"list-section\">\n      <ul>\n        {\n          (items).map((item) => {\n            return <li key={item.id} onClick={() => updateSelectedItem(item.id)}>{item.name}</li>\n          })\n        }\n      </ul>\n    </div>\n  );\n}\n\nexport default ListSection;\n```\n\nContainer Component\n```\nimport LeftSection from './LeftSection';\nimport logo from './logo.svg';\nimport RightSection from './RightSection ';\nimport SelectedItem from './SelectedItem';\nimport \"./App.css\";\nimport ListSection from './ListSection';\nimport { Component, useState } from 'react';\n\nconst products = [\n  {id: 1, name: \"Lime\", size: [\"large\", \"medium\", \"small\"], category: \"Juice\", image: \"lime-juice.jpg\"},\n  {id: 2, name: \"Orange\", size: [\"large\", \"medium\", \"small\"], category: \"Juice\", image: \"orange-juice.jpg\"},\n  {id: 3, name: \"Mango\", size: [\"large\", \"medium\", \"small\"], category: \"Juice\", image: \"mango-juice.jpg\"},\n]\n\nfunction Container() {\n  let [selectItem, setSelectItem] = useState(products[0]);\n\n  function chooseSelectedItem(id) {\n    let item = products.filter((value) => {\n      console.log(value.id);\n      return (value.id == id)\n    })\n    setSelectItem(item[0]);\n    console.log(item[0]);\n  }\n\n  return (\n    <div className=\"Container\">\n      <ListSection items={products} updateSelectedItem={chooseSelectedItem}/>\n      <SelectedItem CurrentSelectedItem={selectItem}/>\n    </div>\n  );\n}\n\nexport default Container;\n```\n\nSelectedItemComponent\n\n```\nimport QuantityBar from \"./QuantityBar\";\nimport \"./SelectedImage.css\"\nimport { useState } yntaxError: invalid syntax\nI reinstalled ROS 2 but it did not resolve the problem. What else could I try?\n\n", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 363, "qid": "bright_ans-f14b75b88c", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "负责任的生活方式是否会给不负责任的生活方式留出更多空间?\n\n在我看来,I'm 为了让自己的生活更可持续而做的各种努力都毫无价值。\n\n确实,当我们当中一些人努力降低能源消耗时,由于“供需关系”决定价格的市场规律,这不就只是让其他人能以更低的价格获得可开采的资源吗?\n\n如果有太多人根本不知道自己对后代有多大危害,只是因为更便宜就消耗得更多,那么在可持续发展方面付出任何努力还有意义吗?", "question_en": "Does responsible living leave more space to unresponsible living?\n\nIt looks to me that the efforts I'm doing to make my living more sustainable are worthless.\n\nIndeed, when some of us make efforts to lower energy consumption, doesn't it only leave harvestable resources for the others at lower price (because of market law \"offer & demand\" making prices)?\n\nIf too many others have no clue how harmful they are for future generation, and only consume more because it is cheaper, is there any point making any effort in the direction of sustainability?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 364, "qid": "bright_ans-f7331e64bf", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "美国人口增长:“自然增长”与“生育率”\n\n根据 2017 年美国人口普查局(US Census)发布的截至 2060 年的人口预测,特别是表 1(预测的人口规模以及出生、死亡和迁移情况),“自然增长”(即美国出生人数减去美国死亡人数)在 2017 年为正值,出生人数比死亡人数多出 100 多万,并且预计到 2060 年一直保持为正,在 2050 年降至最低的 40 万,之后又开始回升。\n\n另一方面,根据 World Bank 的数据,2017 年美国的总和生育率为每名女性 1.8,远低于 2.1 的更替水平。\n\n美国怎么可能出生人数比死亡人数多出 100 多万,并且预计这种正的自然增长还会持续 40 年,而生育率却远低于更替水平呢?\n\n这个问题与之相关,但那里的回答指出,这只是由于人口惯性造成的暂时现象。然而,这里 Census Bureau 预测这种情况将持续 40 年。", "question_en": "US population growth: \"natural increase\" vs \"fertility rate\"\n\nBased on the 2017 US Census population projections through 2060, specifically table 1 (Projected population size and births, deaths, and migration), the \"natural increase,\" which is US births - US deaths, was positive in 2017 at over 1 million more births than deaths, and was projected to remain positive through 2060, reaching a minimum of 400,000 in 2050 before beginning to increase again.\n\nOn the other hand, the fertility rate per woman for the US was 1.8 in 2017, according to the World Bank. This is well below the replacement rate of 2.1.\n\nHow is it possible that the US could have over 1 million more births than deaths, and that a positive natural increase would be projected to continue for 40 years, but be well below replacement fertility rate?\n\nThis question is related, but the answers there indicate that it would be temporary situation due to population momentum. However, here the Census Bureau is predicting it will continue for 40 years.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 365, "qid": "bright_ans-f79cc17ffb", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Do immortal organisms exist?\nDo organisms exist that are able to live indefinitely if they are not killed by external factors?\nUnder external factors I would consider things like predators and natural disaster but not illness by bacteria for example.", "question_en": "Do immortal organisms exist?\nDo organisms exist that are able to live indefinitely if they are not killed by external factors?\nUnder external factors I would consider things like predators and natural disaster but not illness by bacteria for example.", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 3, "exclude_reason": ""}, {"no": 366, "qid": "bright_ans-fbae95dfc9", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "In an area of frequent thunderstorms, I notice a 'crack or whoosh' sound if a strike is nearby but little or no thunder. Yet I can hear for 30 seconds or so after a distant flash when the thunder first is heard, the sound starts at a high frequency and then evolves into a deep rumble that can shake the walls. It approaches the sub-sonic. What is the relationship between the distance and the energy of the strike?", "question_en": "In an area of frequent thunderstorms, I notice a 'crack or whoosh' sound if a strike is nearby but little or no thunder. Yet I can hear for 30 seconds or so after a distant flash when the thunder first is heard, the sound starts at a high frequency and then evolves into a deep rumble that can shake the walls. It approaches the sub-sonic. What is the relationship between the distance and the energy of the strike?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 2, "exclude_reason": ""}, {"no": 367, "qid": "bright_ans-fbb41b802d", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "有没有一个术语可以用来描述想要维持一定程度焦虑的这种渴望?\n\n作为一名患有/曾患有 PTSD 的退伍军人,我注意到自己有一种渴望,想把焦虑和压力的水平维持在更接近我以前所习惯的程度。\n\n你可能也听说过或见过其他退伍军人在退役后出现这类行为,比如从事 High Risk Behavior。\n\n我还认识一些曾被监禁的人和 PhD 毕业生,他们也有同样的表现。\n\n这种行为有没有正式的术语?有没有相关的延伸阅读资料?", "question_en": "Is there a term for the desire to maintain a level of anxiety?\n\nAs a war veteran who has/had PTSD, I've noticed in myself a desire to maintain a level of anxiety and stress closer to what I was used to.\n\nYou've probably also heard/seen this type of behavior from other veterans who engage in High Risk Behavior after separation from service.\n\nI've also known former incarcerated individuals and PhD graduates who do the same.\n\nIs there an official term for this behavior? Further reading on the topic?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 368, "qid": "bright_ans-fcdf6c996e", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Are single-celled organisms capable of learning?\nI've read that the amoeba is capable of learning. Since these protists have no nervous system, it's safe to assume that even highly simplified learning mechanisms of the Aplysia are miles off in the evolutionary distance.\nHow does this species learn? I would presume that there is a complicated chain of receptor mediated transcription regulation, but what are the specifics? What types of receptors does an amoeba have to sense its environs?", "question_en": "Are single-celled organisms capable of learning?\nI've read that the amoeba is capable of learning. Since these protists have no nervous system, it's safe to assume that even highly simplified learning mechanisms of the Aplysia are miles off in the evolutionary distance.\nHow does this species learn? I would presume that there is a complicated chain of receptor mediated transcription regulation, but what are the specifics? What types of receptors does an amoeba have to sense its environs?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 369, "qid": "bright_ans-fcfa4af091", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "How to add to the library search path for custom plugins\n\nGazebo Answers logo\n\nHi,\n\nI'm running a gz-sim (Garden) simulation starting from PX4 where I want to include a custom plugin into my model. The model works if I copy-paste the .so file to any of the default search locations, i.e.\n\n- /home/anton/.gz/sim/plugins/\n- /usr/lib/x86_64-linux-gnu/gz-sim-7/plugins/\n- /home/anton/.ignition/gazebo/plugins/\nHowever, I'd prefer to set an environment variable (as in Gazebo-Classic) to tell gazebo to search for additional plugins. In gazebo-classic I could do\n\nexport GAZEBO_PLUGIN_PATH=\"$PWD:$GAZEBO_PLUGIN_PATH\"\nbut this doesn't seem to work in gz-sim garden.\n\nIs there any other way to add to the library search path of gz-sim?", "question_en": "How to add to the library search path for custom plugins\n\nGazebo Answers logo\n\nHi,\n\nI'm running a gz-sim (Garden) simulation starting from PX4 where I want to include a custom plugin into my model. The model works if I copy-paste the .so file to any of the default search locations, i.e.\n\n- /home/anton/.gz/sim/plugins/\n- /usr/lib/x86_64-linux-gnu/gz-sim-7/plugins/\n- /home/anton/.ignition/gazebo/plugins/\nHowever, I'd prefer to set an environment variable (as in Gazebo-Classic) to tell gazebo to search for additional plugins. In gazebo-classic I could do\n\nexport GAZEBO_PLUGIN_PATH=\"$PWD:$GAZEBO_PLUGIN_PATH\"\nbut this doesn't seem to work in gz-sim garden.\n\nIs there any other way to add to the library search path of gz-sim?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 370, "qid": "bright_ans-fe935d2324", "category": "BRIGHT 可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "我的问题与当前的气候变化进程有关。CO2 不断增加，导致温室效应，使气温升高。这会引发更多的野火，导致树木数量减少，从而增加 CO2，并降低对 CO2 的吸收能力。冰盖开始融化，(积雪减少)使得对阳光的反射减少，大气中困住了更多的热量。海平面上升，淹没陆地和树木，进一步削弱了 CO2 的吸收能力。海洋酸化，也降低了其吸收 CO2 的能力。等等等等。\n\n气候变化的过程似乎是一个“恶性循环”，有很多反馈回路在强化这些趋势。\n\n事实真的是这样吗？有没有与这个循环相抵消的反作用力？", "question_en": "My question refers to the current process of climate change. CO2 is rising, which leads to the greenhouse effect, which raises temperatures. This leads to more wildfires, which reduces number of trees, increasing CO2 and reducing CO2 capacity absorption. Ice caps start to melt, which reduces sunlight reflection (less snow), trapping more heat on atmosphere. Water rises, taking over land and trees, further enhancing the CO2 absorption capacity. Oceans acidify, lowering their CO2 absorption capacity too. Etc etc.\r\n\r\nIt seems the process of climate change is a \"vicious circle\", with a lot of feedback loops reinforcing the trends.\r\n\r\nIs this the case? Are there counteracting forces that go against this circle?", "answer": "（论坛采纳答案，长文，不用于判分）", "gold_docs": 1, "exclude_reason": ""}, {"no": 371, "qid": "bright_unans-0cd7c82fc3", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "中文", "status": "有效", "question": "Nav2 Custom Costmap 插件订阅问题 [Closed]\n\nClosed 5 days ago.\n\n我正在尝试为 nav2 编写一个 costmap 插件,需要从某个话题中获取特定数据,但我无法在插件内部创建并 spin 订阅。(我需要坐标点,以便在这些点上创建障碍物)", "question_en": "Nav2 Custom Costmap plugin subscription [closed]\n\nClosed 5 days ago.\n\nI am trying to write a costmap plugin for nav2 and i need to get a specific data from a topic but i couldnt create and spin the subscription inside the plugin. (I need coordinate points to create an obstacle at those points)", "answer": "知识库中没有（原答案：$\\begingroup$  Could you elaborate the issue further with any relevant logs? As ）", "gold_docs": 0, "exclude_reason": ""}, {"no": 372, "qid": "bright_unans-10cc999325", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "中文", "status": "有效", "question": "我正在尝试解决下面这个问题:过去的海平面比现在高 200 m。海水与洋盆达到了均衡(isostatic equilibrium)。洋盆深度的增加量 x 是多少?水的密度为 ρw=1000 kg m−3,地幔密度为 3300 kg m−3。\n\n我使用补偿柱(compensation column)的方法,得到:\n\nx=(ρw∗200 m)/3300=60.60 m\n\n但我原本预期的答案是 290 m。\n\n有人能给我解释一下我哪里做错了吗?", "question_en": "I'm trying to solve the following problem. The sea level in the past was 200 m higher than today. The seawater became in isostatic equilibrium with the ocean basin. what is the increase in the depth x\r\n of the ocean basins? Water density is ρw=1000 kg m−3\r\n, and mantle density is 3300 kg m−3\r\n.\r\n\r\nUsing the compensation column, I reach:\r\n\r\nx=(ρw∗200 m)/3300=60.60 m\r\nbut normally I expected to find 290 m.\r\n\r\nCan someone explain to me what's wrong?", "answer": "知识库中没有（原答案：$\\begingroup$  I am assuming you are asking for the case of sea level being 200m）", "gold_docs": 0, "exclude_reason": ""}, {"no": 373, "qid": "bright_unans-1359f162bd", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "英文", "status": "有效", "question": "How can humans tell when something diverges from the norm\n\nWith this I mean the notion of humans being able to, for example, look at a painting and tell that something doesn't belong in there. For example sun glasses on the Mona Lisa, without prior knowledge of the painting. I just find it easier to spot or add things to something that are wrong than to add something that fits in perfectly.\n\nI found some pointers to Gestalt Theory but I couldn't find anything there yet. I'll keep looking but maybe someone here knows what I'm trying to convey. Thanks.", "question_en": "How can humans tell when something diverges from the norm\n\nWith this I mean the notion of humans being able to, for example, look at a painting and tell that something doesn't belong in there. For example sun glasses on the Mona Lisa, without prior knowledge of the painting. I just find it easier to spot or add things to something that are wrong than to add something that fits in perfectly.\n\nI found some pointers to Gestalt Theory but I couldn't find anything there yet. I'll keep looking but maybe someone here knows what I'm trying to convey. Thanks.", "answer": "知识库中没有（原答案：$\\begingroup$  The [ predictive coding ](https://en.wikipedia.org/wiki/Predictiv）", "gold_docs": 0, "exclude_reason": ""}, {"no": 374, "qid": "bright_unans-153095183f", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "英文", "status": "有效", "question": "Can a bacterium infect another bacterium?\nI researched about it by searching on Google and reading some bacteriological articles, but I did not get any answer. I also asked some of my teachers, and they were also a bit confused. Some said that it is possible and others said not. So the question remains:\nCan a bacterium infect another bacterium? If so, how?", "question_en": "Can a bacterium infect another bacterium?\nI researched about it by searching on Google and reading some bacteriological articles, but I did not get any answer. I also asked some of my teachers, and they were also a bit confused. Some said that it is possible and others said not. So the question remains:\nCan a bacterium infect another bacterium? If so, how?", "answer": "知识库中没有（原答案：$\\begingroup$  _[ Bdellovibrio bacteriovorus ](https://en.wikipedia.org/wiki/Bde）", "gold_docs": 0, "exclude_reason": ""}, {"no": 375, "qid": "bright_unans-1c8cd429ff", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "—", "lang": "英文", "status": "排除", "question": "Why use a quasi experimental design when you can do an experiment?\n\nI read about quasi-experimental design and the variations it has such as pre-test post-test non-equivalent groups, and also experimental designs. Having compared these two, I ascertained that the difference between this variation of quasi-experimental design(pre-test post-test non-equivalent groups) and experimental design is randomization. However, what I couldn't understand was:\n\nWhy should quasi-experimental design even exist when we can do randomization easily and the randomization has more benefits than matching the participants?\n\nHonestly, I search for the answer but I couldn't find any, and obviously that is why I'm asking a question, yet if you find any alike question I would be happy if you refer me to it. I genuinely appreciate it if you refer me to at least one resource as well. The reference book for the discrimination between these two designs: Introduction to Research Methods and Data Analysis in Psychology, Third Edition by Darren Langdridge and Gareth Hagger-Johnson", "question_en": "Why use a quasi experimental design when you can do an experiment?\n\nI read about quasi-experimental design and the variations it has such as pre-test post-test non-equivalent groups, and also experimental designs. Having compared these two, I ascertained that the difference between this variation of quasi-experimental design(pre-test post-test non-equivalent groups) and experimental design is randomization. However, what I couldn't understand was:\n\nWhy should quasi-experimental design even exist when we can do randomization easily and the randomization has more benefits than matching the participants?\n\nHonestly, I search for the answer but I couldn't find any, and obviously that is why I'm asking a question, yet if you find any alike question I would be happy if you refer me to it. I genuinely appreciate it if you refer me to at least one resource as well. The reference book for the discrimination between these two designs: Introduction to Research Methods and Data Analysis in Psychology, Third Edition by Darren Langdridge and Gareth Hagger-Johnson", "answer": "知识库中没有（原答案：$\\begingroup$  The first paper I found searching for \"advantages of quasi-experi）", "gold_docs": 0, "exclude_reason": "leak (check 1): ['bright/psychology/quasiexperimentalresearch1.md', 'bright/psychology/quasiexperimentalresearch.md'] — Doc 0 (QuestionPro) gives the ethical reason for quasi-experiments: in the depression-therapy example, doctors would find a genuine randomized trial unethical because it leaves one group untreated, so pre-existing groups are used instead. Doc 2 (BCcampus) says quasi-experiments are most likely condu | substantive answer possible at [3000] (check 1)"}, {"no": 376, "qid": "bright_unans-1f1b7f5af9", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "中文", "status": "有效", "question": "向上攀升社会阶层的人\n\nWe know 处于社会阶层顶端的人(至少在发达国家)平均预期寿命要长30年或更多,婚姻也更稳定,生活更幸福,等等。所以我的问题是,对于那些成功从底层爬到顶层的人,他们的预期离婚率、预期寿命等等会是怎样的?更接近底层的人,还是更接近顶层的人?有任何相关研究都会很有帮助。", "question_en": "People who climb the social hierarchy\n\nWe know that people on top of the social hierarchy have (at least in developed countries) 30 or more years average life expectancy , more stable marriages, happier life and so on. So my question is for people who managed to get from the bottom to the top, what is their expected divorce rate, life expectancy and so on. It is more like the bottom or more like the top. Any research would help.", "answer": "知识库中没有（原答案：$\\begingroup$  I think you want the term Life Course Social Mobility. Try search）", "gold_docs": 0, "exclude_reason": ""}, {"no": 377, "qid": "bright_unans-3cabd765b4", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900", "lang": "英文", "status": "有效", "question": "What are some negative/positive aspects from globalization in regard to developed countries?\n\nI have read many articles on how globalization is helping developing countries, as more and more companies from developed countries have been moving their production oversees. However, as hard as I tried, I couldn't find a lot of articles talking about the opposite site of the story - How globalization affects developed countries.\n\nMost of the articles I found were focused on the fact that moving production oversees will increase the unemployment and decrease the GDP. However, are there any other aspects (positive or negative)? Would love to learn more about this topic and if you have a good article that dives into this I would be really grateful if you can provide me with a link to it.", "question_en": "What are some negative/positive aspects from globalization in regard to developed countries?\n\nI have read many articles on how globalization is helping developing countries, as more and more companies from developed countries have been moving their production oversees. However, as hard as I tried, I couldn't find a lot of articles talking about the opposite site of the story - How globalization affects developed countries.\n\nMost of the articles I found were focused on the fact that moving production oversees will increase the unemployment and decrease the GDP. However, are there any other aspects (positive or negative)? Would love to learn more about this topic and if you have a good article that dives into this I would be really grateful if you can provide me with a link to it.", "answer": "知识库中没有（原答案：$\\begingroup$  I did a search in Google Scholar and it seems that most papers ma）", "gold_docs": 0, "exclude_reason": "substantive answer possible at [3000] (check 1)"}, {"no": 378, "qid": "bright_unans-3f4016d3ea", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300", "lang": "中文", "status": "有效", "question": "我正在为一款开放世界太空沙盒游戏程序化生成行星,并使用一种粗略的板块构造模拟来生成山脉和其他地质特征。\n\n行星表面由若干板块组成,每个板块又由许多瓦片(tile)构成。大陆板块是随机生成的,并被随机分配初始海拔和漂移速度。\n\n瓦片的海拔是通过将一个包络函数( e^{ -d^2 } )与一个针对不同类型板块边界和相对漂移速度的函数相乘得到的。\n\n为了追求真实感,陆地与海洋之间是否可能存在离散(分离)型板块边界?我在网上没找到任何相关资料,而且就我所查到的,Earth 上似乎也没有这样的例子。是否可以放心地认为,离散型边界只会出现在陆地-陆地和海洋-海洋的板块边界之间?", "question_en": "I am procedurally generating planets for an open world space sandbox game. I am using a rough simulation of tectonic plates to create mountain ranges and other geological features.\n\nA planet surface consists of several plates, which consists of tiles. The continental plates are randomly generated, with random initial elevation and drift velocities assigned.\n\nTile elevations are generated by multiplying an envelope ( e^{ -d^2 } ) with a function for different types of plate boundaries and relative drift velocities.\n\nFor the sake of realism, is it possible to have a land-ocean divergent plate boundary? I could not find anything online. There also doesn't seem to be any examples on Earth from what I could find. Is it safe to assume that divergent boundaries only occur between land-land and ocean-ocean plate boundaries?", "answer": "知识库中没有（原答案：$\\begingroup$  The oceanic plates are themselves formed from the [ divergent bou）", "gold_docs": 0, "exclude_reason": "substantive answer possible at [900, 3000] (check 1)"}, {"no": 379, "qid": "bright_unans-49eb0d4357", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "英文", "status": "有效", "question": "I am trying to understand the concrete process of how a meteorologist at a weather forecast office produces the different types of weather forecasts. I understand how numerical weather models work, but I would like to learn how the model output is turned into a forecast and to what extend it is improved by a skilled meteorologist.\r\n\r\nI have found an older reference from 1993 that has some information on the workflow, https://esrl.noaa.gov/gsd/eds/gfesuite/pubs/AWIPS-Forecast-Preparation-System.pdf but this is probably outdated and doesn't talk about the meteorological side.\r\n\r\nThere are a lot of different forecast products from text to graphical products, so my question might be an overly broad one, but I haven't found much information so far, so I don't want to be too restrictive.\r\n\r\nWhat concrete model outputs do forecasters look at and to what extend do they use local observations and experience?", "question_en": "I am trying to understand the concrete process of how a meteorologist at a weather forecast office produces the different types of weather forecasts. I understand how numerical weather models work, but I would like to learn how the model output is turned into a forecast and to what extend it is improved by a skilled meteorologist.\r\n\r\nI have found an older reference from 1993 that has some information on the workflow, https://esrl.noaa.gov/gsd/eds/gfesuite/pubs/AWIPS-Forecast-Preparation-System.pdf but this is probably outdated and doesn't talk about the meteorological side.\r\n\r\nThere are a lot of different forecast products from text to graphical products, so my question might be an overly broad one, but I haven't found much information so far, so I don't want to be too restrictive.\r\n\r\nWhat concrete model outputs do forecasters look at and to what extend do they use local observations and experience?", "answer": "知识库中没有（原答案：$\\begingroup$  The Virtual tour is good, and I don't know why that wasn't an acc）", "gold_docs": 0, "exclude_reason": ""}, {"no": 380, "qid": "bright_unans-a47b79e995", "category": "BRIGHT 不可回答", "tier": "核心", "scales": "300/900/3000", "lang": "中文", "status": "有效", "question": "这更像是一个术语方面的问题,但我觉得放在这里也合适。我最近在读 Rachel Carson 上世纪50年代初写的一本书,她在书中用了 \"Archaeozic period\" 这个说法。我在别处从没见过这个词——它只是 \"Archean\"(太古宙)的一种过时(请原谅这个双关)的写法,还是指的是另一个地质时期?从词源上看,它似乎更偏重于“生命”,但这也可能只是语义上的区别。", "question_en": "This is more of a terminological question, but I think it fits here. I've been reading a book by Rachel Carson, from the early 50s, and she uses the phrase \"Archaeozic period\". I haven't seen this used elsewhere - is it just an archaic (pardon the pun) form of \"Archean\", or does it describe a different period? Etymologically, it seems like it's more oriented around \"life\", but that may just be a semantic distinction.", "answer": "知识库中没有（原答案：$\\begingroup$  The [ Archaen ](https://en.wikipedia.org/wiki/Archean) was named ）", "gold_docs": 0, "exclude_reason": ""}, {"no": 381, "qid": "bright_unans-166e4e01b0", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "我正在按照这篇论文，使用 ERA5 气象变量计算 UTCI。\n\nhttps://link.springer.com/article/10.1007/s00484-020-01900-5?shared-article-renderer\n\n论文中作者提到他们使用的是 ERA5 产品，并且特别说明要使用短波（SW）辐射的直接分量和散射分量。\n\n问题是，ERA5 数据并没有分别提供直接 SW 和散射 SW，而只提供 Surface solar radiation downwards，其中同时包含了直接分量和散射分量。\n\n我的问题是：有没有办法从 ERA5 中计算出 SW 的直接分量和散射分量？我手头的数据集与 ERA5 类似，包含 Downward SW 和 Net SW。顺便说一下（BTW），获取 Long 波辐射对我来说没有问题。\n\n任何帮助都将不胜感激。TIA", "question_en": "I am following the paper to calculate UTCI using ERA5 meteorological variables.\r\n\r\nhttps://link.springer.com/article/10.1007/s00484-020-01900-5?shared-article-renderer\r\n\r\nIn the paper, the authors have mentioned that they are using ERA5 product. And specifically mentioned to use the direct and diffuse component of shortwave (SW) radiation.\r\n\r\nThe problem is, ERA5 data does not provide the direct and diffuse SW separately. Rather it only provides Surface solar radiation downwards which includes both the direct and diffuse component.\r\n\r\nMy question would be, is there a way to calculate the direct and diffuse component of SW from ERA5. The dataset I have is similar to ERA5 and has the Downward SW and Net SW. I have no problem in obtaining the Long waves BTW.\r\n\r\nAny help would be much appreciated. TIA", "answer": "知识库中没有（原答案：$\\begingroup$  [ This paper ](https://gmd.copernicus.org/articles/7/387/2014/gmd）", "gold_docs": 0, "exclude_reas  <static>true</static>\n    </model>\n  </world>\n</sdf>\nI tried to publish the pose of the lidar using pose-publisher-system as well. Thank you.", "answer": "知识库中没有（原答案：$\\begingroup$  A Gazebo Sim system plugin can only be attached to a ` <world> ` ）", "gold_docs": 0, "exclude_reason": ""}, {"no": 384, "qid": "bright_unans-33327910c8", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "如何用 Electron 实现跨平台的音视频录制\n\n我在做一个 Electron 项目,想用 desktopCapture 录制屏幕,同时录制桌面或所选应用的音频。屏幕录制我已经实现了,有一次甚至还成功让麦克风工作了,但无论我怎么尝试,始终无法录制桌面音频,也无法录制任何应用的音频。查了一些资料后,我发现在 Linux 上用 Chromium 是无法录制桌面或应用音频的。\n\n那有什么解决办法,或者其他方式可以录制桌面音频吗?也许可以用别的库来录制桌面音频,然后再想办法把视频和音频合并起来。\n\n欢迎提出任何建议。\n\n屏幕录制部分的代码如下:\n```\nvideoSelectBtn.onclick = getVideoSources;\n\nasync function getVideoSources() {\n  const inputSources = await desktopCapturer.getSources({\n    types: [\"window\", \"screen\", \"audio\"],\n  });\n\n  inputSources.forEach((source) => {\n    if (source.name === \"Screen 1\") {\n      selectSource(source);\n    } else {\n      console.log(source);\n    }\n  });\n}\n\nasync function selectSource(source) {\n  videoSelectBtn.innerText = source.name;\n\n  const constraints = {\n    audio: {\n      mandatory: {\n        chromeMediaSource: \"desktop\",\n      },\n    },\n    video: {\n      mandatory: {\n        chromeMediaSource: \"desktop\",\n      },\n    },\n  };\n\n  const stream = await navigator.mediaDevices.getUserMedia(constraints);\n```", "question_en": "How to record audio and video corss platform with electron\n\nSo i was making a electron project that records your screen and your desktop or selected app's audio with desktopCapture. I got the screen record, and at one point even got the mic to work, but at no point, no matter what i tried, i couldn't record desktop audio nor any app's audio. After some research i found that you cannot record any desktop nor app's audio with chromium on linux.\n\nSo what could be the solution or some other ways to try to record desktop audio. Maybe there is some way to record desktop audio with a different library and then combine the video with audio somehow.\n\nAny suggestions would be appreciated.\n\nCode for the screen recorder itself:\n```\nvideoSelectBtn.onclick = getVideoSources;\n\nasync function getVideoSources() {\n  const inputSources = await desktopCapturer.getSources({\n    types: [\"window\", \"screen\", \"audio\"],\n  });\n\n  inputSources.forEach((source) => {\n    if (source.name === \"Screen 1\") {\n      selectSource(source);\n    } else {\n      console.log(source);\n    }\n  });\n}\n\nasync function selectSource(source) {\n  videoSelectBtn.innerText = source.name;\n\n  const constraints = {\n    audio: {\n      mandatory: {\n        chromeMediaSource: \"desktop\",\n      },\n    },\n    video: {\n      mandatory: {\n        chromeMediaSource: \"desktop\",\n      },\n    },\n  };\n\n  const stream = await navigator.mediaDevices.getUserMedia(constraints);\n```", "answer": "知识库中没有（原答案：This seems to be related to Chrome that doesn't allow to record other audio sour）", "gold_docs": 0, "exclude_reason": ""}, {"no": 385, "qid": "bright_unans-39de75c869", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "—", "lang": "中文", "status": "排除", "question": "White Bear 原理的反面叫什么?\n\n有没有什么词或术语可以用来描述 White Bear 原理(也称反讽过程原理)的反面?I'm 正在找一个词,用来形容这样一种过程:越是努力去想某件事(或回忆某件事),它就越是躲着你。我觉得自己好像见过描述这种现象的术语,但 I'm 不确定是否真的存在这样的词或说法。", "question_en": "Opposite of White Bear principle?\n\nIs there any phrase/term to describe the opposite of White Bear principle (also known as ironic process principle)? I'm looking for a word to describe the process where something eludes you the more you try to think of it (or remember it). I think I may have come across a term to describe this phenomenon but I'm not sure if such a phrase/term exists.", "answer": "知识库中没有（原答案：$\\begingroup$  **Short answer**   **[ Over-thinking ](http://www.news.ucsb.edu/2）", "gold_docs": 0, "exclude_reason": "substantive answer possible at [900, 3000] (check 1)"}, {"no": 386, "qid": "bright_unans-3ee6202001", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "能通过加快植物周围环境的变化来加速植物生长吗?\n我第一次参观一家使用泛光灯代替阳光的室内苗圃时,冒出了一个让植物长得更快的奇怪想法。那里的灯在白天亮起,夜里熄灭,循环往复。\n如果缩短这种循环的时间周期,在植物看来就好像地球突然切换到了快进模式。这样能骗过植物,让它们长得更快吗?\n如果当代植物不行,那以这种方式种植的后代植物会适应新的节律吗?\n(假设为植物提供了充足的养分,以满足新的需求。)\n如果这真的可行,我很想亲自做这个实验!", "question_en": "Can you accelerate the growth of a plant by accelerating its surroundings?\nI had this weird idea of making plants grow faster when I first visited an indoor nursery which used floodlights instead of sunlight. They turned on during the day and went off during night in cycles.\nIf the time period of the cycles are decreased, it would seem to the plants that the earth just switched to fast-motion. Will this trick the plants into growing faster?\nIf not the current generation, would the later generations of plants grown like this adapt to the new rhythm ?\n(Given that the plant is provided with surplus nutrients to meet the new requirements.)\nI would love to do the experiment myself if it would actually work!", "answer": "知识库中没有（原答案：$\\begingroup$  This is not the best answer, but see that as a starter! Feel free）", "gold_docs": 0, "exclude_reason": ""}, {"no": 387, "qid": "bright_unans-5768eecfe6", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900", "lang": "中文", "status": "有效", "question": "北极光和南极光（也称为 Auroras）在磁极附近呈现出壮观景象，其科学原理是什么？为什么北极光与南极光会有所不同？", "question_en": "What is the scientific reason for the majestic sights of the northern and southern lights, otherwise known as Auroras near the magnetic poles, and why do the northern lights differ from the southern lights?", "answer": "知识库中没有（原答案：$\\begingroup$  Straight from [ wikipedia ](https://en.wikipedia.org/wiki/Aurora#）", "gold_docs": 0, "exclude_reason": "substantive answer possible at [3000] (check 1)"}, {"no": 388, "qid": "bright_unans-6659e8b911", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Identify kind of descriptive role playing game for self-discovery\n\nThere's a comic book called \"Knights of the Dinner Table\" about a bunch of rpg players.\n\nIn one issue, the only girl at the table GM's some kind of self-discovery game she learnt in her psychology class. She describes some situations and asks for details from the players, giving an example herself.\n\nAt one point, for example, she says:\n\nOk, so you continue your journey down your own personal path. Soon you come to a large bear! What do you do? My bear turns out to be very tame and I'm able to hand feed it and befriend it! He decides to accompany me on my journey.\n\nAt the end, she explains what each thing symbolizes:\n\nThe bear represents adversity and how you deal with it\n\nSupposedly this is (loosely) based on a real exercise for self discovery. I would like to know more about the real exercise in which this is based, but I don't know how to start.\n\nAny idea how this exercise is called, or how can I find more information about something similar?\n\nThanks.", "question_en": "Identify kind of descriptive role playing game for self-discovery\n\nThere's a comic book called \"Knights of the Dinner Table\" about a bunch of rpg players.\n\nIn one issue, the only girl at the table GM's some kind of self-discovery game she learnt in her psychology class. She describes some situations and asks for details from the players, giving an example herself.\n\nAt one point, for example, she says:\n\nOk, so you continue your journey down your own personal path. Soon you come to a large bear! What do you do? My bear turns out to be very tame and I'm able to hand feed it and befriend it! He decides to accompany me on my journey.\n\nAt the end, she explains what each thing symbolizes:\n\nThe bear represents adversity and how you deal with it\n\nSupposedly this is (loosely) based on a real exercise for self discovery. I would like to know more about the real exercise in which this is based, but I don't know how to start.\n\nAny idea how this exercise is called, or how can I find more information about something similar?\n\nThanks.", "answer": "知识库中没有（原答案：$\\begingroup$  I finally found it, apparently it's called [ The Forest Test ](ht）", "gold_docs": 0, "exclude_reason": ""}, {"no": 389, "qid": "bright_unans-9469d488b2", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "中文", "status": "有效", "question": "聚丙烯酰胺(Polyacrylamide)是用来制造微珠的材料吗?\n\n我发现一款磨砂洗面奶的成分表里有聚丙烯酰胺(Polyacrylamide)。因为聚丙烯酰胺是用来制造微珠的,所以我应该避免使用它吗?", "question_en": "Is Polyacrylamide a material used to make microbeads?\n\nI found a face scrub that states Polyacrylamide as an ingredient. Should I avoid it because Polyacrylamide is used to make the microbeads?", "answer": "知识库中没有（原答案：##  No, polyacrylamide is not used to make plastic microbeads  [ According to Wi）", "gold_docs": 0, "exclude_reason": ""}, {"no": 390, "qid": "bright_unans-97cf0a6092", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900", "lang": "中文", "status": "有效", "question": "What will be the Effect of the Russian oil Price Cap\n\nG7 国家刚刚宣布，除非价格在 USD 60/barrel 或以下，否则不会购买 Russia 的石油。这一限价（Price Cap）会产生什么影响？它会是一种有效的经济制裁吗？为什么 Russia 不能把石油卖给非 G7 的中间商，再由中间商转卖给 G7 国家？此外，它会对石油的市场价格造成什么影响？", "question_en": "What will be the Effect of the Russian oil Price Cap\n\nG7 countries have just announced that they will not buy oil from Russia unless the price is USD 60/barrel or below. What will be the effect of this cap- will it be an effective economic sanction? Why can’t Russia sell the oil to a non G7 intermediary who sells it to G7? And what will it do to the market price of oil ?", "answer": "知识库中没有（原答案：$\\begingroup$  > What will be the effect of this cap- will it be an effective ec）", "gold_docs": 0, "exclude_reason": "leak at [3000] (check 2): ['bright/economics/sanctionsandrussiaswarlimitingputinscapabilities.md'] — Passage 1 explains the price ca
