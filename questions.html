at oblique angles to the planet's radial direction. (I am not very sure about this, but since it is not a freefall, we can assume that the collision is oblique).\n\nSo why are most of the craters radially symmetric?\n\nWhy isn't the depression skewed?\n\nI have almost never come across a photograph of a skewed crater.", "answer": "知识库中没有（原答案：$\\begingroup$  The main reason why impact craters are close to symmetrically rou）", "gold_docs": 0, "exclude_reason": ""}, {"no": 393, "qid": "bright_unans-af3c766634", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Instructions for making, and comparisons of, *small* solar thermal collectors\n\nThe web has probably thousands of pages with instructions on how to build solar devices for heating air, water, and probably things I've never even thought of.\n\nWikipedia describes different types of thermal solar collectors, but really has a commercial focus.\n\nHowever, when it comes to choosing an affordable design that might be useful for a DIY project at home (or for a small business), it's unclear exactly where to start looking and how to compare designs.\n\nAre there any websites that act like a hub for this information and index or categorise the different techniques and devices?\n\nFor this question I'd like to focus, if possible, on finding a site that compares and rates different designs, as well as possibly providing instructions on building them.", "question_en": "Instructions for making, and comparisons of, *small* solar thermal collectors\n\nThe web has probably thousands of pages with instructions on how to build solar devices for heating air, water, and probably things I've never even thought of.\n\nWikipedia describes different types of thermal solar collectors, but really has a commercial focus.\n\nHowever, when it comes to choosing an affordable design that might be useful for a DIY project at home (or for a small business), it's unclear exactly where to start looking and how to compare designs.\n\nAre there any websites that act like a hub for this information and index or categorise the different techniques and devices?\n\nFor this question I'd like to focus, if possible, on finding a site that compares and rates different designs, as well as possibly providing instructions on building them.", "answer": "知识库中没有（原答案：Excellent question, and I agree that much of the information is too focused on t）", "gold_docs": 0, "exclude_reason": ""}, {"no": 394, "qid": "bright_unans-b0734cc306", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900", "lang": "英文", "status": "有效", "question": "Why isn't economic growth defined in terms of the increase in national wealth?\n\nEconomic growth is defined as the increase in production or output per unit time. Why isn't it instead defined in terms of the increase in national wealth?", "question_en": "Why isn't economic growth defined in terms of the increase in national wealth?\n\nEconomic growth is defined as the increase in production or output per unit time. Why isn't it instead defined in terms of the increase in national wealth?", "answer": "知识库中没有（原答案：$\\begingroup$  Because the word _economic_ in economic growth refers to growth o）", "gold_docs": 0, "exclude_reason": "leak at [3000] (check 2): ['bright/economics/adamsmithandcapitali.md'] — The question asks why growth is measured as an increase in output rather than an increase in the stock of national wealth. Passage 0 gives a rationale: mercantilism tied a nation's wealth to its stock of gold, silver and goods, while Adam Smith argued that overall labor and production were the bette"}, {"no": 395, "qid": "bright_unans-b1f0483d60", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "—", "lang": "中文", "status": "排除", "question": "日常生活中如何利用海水？\n\n我们这里这几天因为缺少降雨，河水供应短缺。人们都在呼吁在可以的地方使用海水，所以请大家推荐一下我们可以用海水的各种方法……", "question_en": "How to use sea water in daily life?\n\nHere in my place there is a shortage of river water during these days because of lack of rain. People are demanding to use sea water where we can so please suggest the ways in which we can use sea water...", "answer": "知识库中没有（原答案：To produce fresh water from sea water sustainably (i.e. sustainable in usage, if）", "gold_docs": 0, "exclude_reason": "substantive answer possible at [900, 3000] (check 1)"}, {"no": 396, "qid": "bright_unans-b2ad9c3d4b", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "CO2 emissions from outdoor fire pit\n\nI have an outdoor fire pit in my backyard. The fire pit is about 3 feet in diameter and is similar to ones you might find at a camp site. My family and I enjoy using it purely for recreation. I’ve been trying to limit my carbon footprint, and in doing so, wondered how much a fire in the fire pit contributes to it. We usually have about 2 to 3 logs, and a handful of sticks. So what’s an estimate for how many pounds of CO2 are released every hour of from an average sized camp fire? Are there other gases released other than CO2 that are harmful to the environment?", "question_en": "CO2 emissions from outdoor fire pit\n\nI have an outdoor fire pit in my backyard. The fire pit is about 3 feet in diameter and is similar to ones you might find at a camp site. My family and I enjoy using it purely for recreation. I’ve been trying to limit my carbon footprint, and in doing so, wondered how much a fire in the fire pit contributes to it. We usually have about 2 to 3 logs, and a handful of sticks. So what’s an estimate for how many pounds of CO2 are released every hour of from an average sized camp fire? Are there other gases released other than CO2 that are harmful to the environment?", "answer": "知识库中没有（原答案：###  The Short Answer  Burning 1 kg of wood releases 1.6 kg of CO  2  . (source:）", "gold_docs": 0, "exclude_reason": ""}, {"no": 397, "qid": "bright_unans-c7a5c7666f", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Where can I find a calculator for constrained optimization of general form of algebraic equation?\n\nI'm working with a fairly complex equation and I need to carry out constrained optimization of the same. The first order differential equations are very messy to solve by hand and hence I thought to use online calculators. Problem with calculators like wolfram is that I cannot choose the variables with respect to which optimization needs to be done. If I use numbers in place of other variables it would defy the purpose. Are there any calculators available online for the problem I have? I am open to use coding based software like Matlab.\n\nFor example:\nMaximize  𝑎𝑥𝑏−𝑥\n\nw.r.t  𝑥\n\ns.t.  𝑥>0,𝑎>1,0<𝑏<1\n\nThe original problem is multivariable and much more complex. I don't want to optimize with specific values for a,b.", "question_en": "Where can I find a calculator for constrained optimization of general form of algebraic equation?\n\nI'm working with a fairly complex equation and I need to carry out constrained optimization of the same. The first order differential equations are very messy to solve by hand and hence I thought to use online calculators. Problem with calculators like wolfram is that I cannot choose the variables with respect to which optimization needs to be done. If I use numbers in place of other variables it would defy the purpose. Are there any calculators available online for the problem I have? I am open to use coding based software like Matlab.\n\nFor example:\nMaximize  𝑎𝑥𝑏−𝑥\n\nw.r.t  𝑥\n\ns.t.  𝑥>0,𝑎>1,0<𝑏<1\n\nThe original problem is multivariable and much more complex. I don't want to optimize with specific values for a,b.", "answer": "知识库中没有（原答案：$\\begingroup$  You can set the decision variables in Wolfram Alpha. E.g.,  > max）", "gold_docs": 0, "exclude_reason": ""}, {"no": 398, "qid": "bright_unans-d174b7d932", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "Set interface name without msg in ROS2\n\nWhen creating custom message types in ROS1 (noetic), I can store the *.msg files in a subfolder named msg. In the CMake file, I just type the name of the file without msg/ in add_message_files(...). The resulting message type is named as <pkg_name>/<file-name (without .msg)>\n\nWhen creating interfaces in ROS2 (foxy), I have to type the file name in my CMake file including the relative path in rosidl_generate_interfaces(...) like msg/<filename.msg>. The resulting interface name also includes msg: <pkg_name>/msg/<file-name (without .msg)>, but actually I don't want the exact path as an interface name.\n\nSo my question is: Is it possible to store the files in the msg folder for a better folder structure but set the name of the resulting interface differently?", "question_en": "Set interface name without msg in ROS2\n\nWhen creating custom message types in ROS1 (noetic), I can store the *.msg files in a subfolder named msg. In the CMake file, I just type the name of the file without msg/ in add_message_files(...). The resulting message type is named as <pkg_name>/<file-name (without .msg)>\n\nWhen creating interfaces in ROS2 (foxy), I have to type the file name in my CMake file including the relative path in rosidl_generate_interfaces(...) like msg/<filename.msg>. The resulting interface name also includes msg: <pkg_name>/msg/<file-name (without .msg)>, but actually I don't want the exact path as an interface name.\n\nSo my question is: Is it possible to store the files in the msg folder for a better folder structure but set the name of the resulting interface differently?", "answer": "知识库中没有（原答案：$\\begingroup$  You certainly _can_ change the destination of any files produced ）", "gold_docs": 0, "exclude_reason": ""}, {"no": 399, "qid": "bright_unans-d29c3a321a", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900/3000", "lang": "英文", "status": "有效", "question": "What determines a robots euler rotation order?\n\nI know Fanuc robots use the XYZ rotation order, ABB uses ZYX and some robots use the ZYZ rotation order. What actually determines this order? is it the way the frames are setup on the DH table? Or is it just the order they chose to solve the IK, and any order could be used? Can anyone help me understand this? TY.", "question_en": "What determines a robots euler rotation order?\n\nI know Fanuc robots use the XYZ rotation order, ABB uses ZYX and some robots use the ZYZ rotation order. What actually determines this order? is it the way the frames are setup on the DH table? Or is it just the order they chose to solve the IK, and any order could be used? Can anyone help me understand this? TY.", "answer": "知识库中没有（原答案：$\\begingroup$  Any [ euler angles triplet ](https://en.wikipedia.org/wiki/Euler_）", "gold_docs": 0, "exclude_reason": ""}, {"no": 400, "qid": "bright_unans-f52abcd29b", "category": "BRIGHT 不可回答", "tier": "扩展", "scales": "900", "lang": "英文", "status": "有效", "question": "Why the eco-friendly soy ink is not abundent on the market?\n\nFrom time to time I see on different papers \"Printed with eco-friendly ink,\" so I assume that it is the soy-based ink. I have read a bit about it, and the opinions about soy-ink being eco-friendly are split, but I would say that it's definitely better than oil-based, as it contains less volatile substances.\n\nThen I wanted to buy one for my printer and... surprise! I cannot really find a trustworthy website (in my opinion) where one can buy it. Now my question is... Why? Why don't we see an abundance of such eco-friendly solutions? And where do the manufacturers of eco-friendly printouts find it? Or is it just a marketing text without any cover? Is there any label that can vouch for that?", "question_en": "Why the eco-friendly soy ink is not abundent on the market?\n\nFrom time to time I see on different papers \"Printed with eco-friendly ink,\" so I assume that it is the soy-based ink. I have read a bit about it, and the opinions about soy-ink being eco-friendly are split, but I would say that it's definitely better than oil-based, as it contains less volatile substances.\n\nThen I wanted to buy one for my printer and... surprise! I cannot really find a trustworthy website (in my opinion) where one can buy it. Now my question is... Why? Why don't we see an abundance of such eco-friendly solutions? And where do the manufacturers of eco-friendly printouts find it? Or is it just a marketing text without any cover? Is there any label that can vouch for that?", "answer": "知识库中没有（原答案：**tl;dr:** A lot of soy ink is used, but mixed with petroleum-based ink.  * * * ）", "gold_docs": 0, "exclude_reason": "leak at [3000] (check 2): ['bright/sustainable_living/soyinkseal.md'] — Passage 1 answers the label question and the 'is it just marketing' question. It describes the American Soybean Association's SoySeal, a licensed label with minimum soybean oil content standards per ink type, such as 40% for black news ink. It also says about one-third of US newspaper printers and o"}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F={category:new Set(),lang:new Set(),status:new Set(["有效"])};
function chips(id,key,vals){const h=document.getElementById(id);h.innerHTML=vals.map(v=>`<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${!F[key].size||F[key].has(v)}">${esc(v)}</button>`).join(" ");}
function uniq(k){return [...new Set(R.map(r=>r[k]))];}
function cellQ(r){const long=r.question.length>220;const main=long?`<details><summary>${esc(r.question.slice(0,160))}…</summary><div class="long">${esc(r.question)}</div></details>`:esc(r.question);
 const orig=r.lang==="中文"?`<div class="orig">${esc(r.question_en.length>220?r.question_en.slice(0,220)+"…":r.question_en)}</div>`:"";return main+orig;}
function render(){
 const term=document.getElementById("q").value.trim().toLowerCase();
 const rs=R.filter(r=>(!F.category.size||F.category.has(r.category))&&(!F.lang.size||F.lang.has(r.lang))&&(!F.status.size||F.status.has(r.status))
   &&(!term||(r.question+" "+r.question_en+" "+r.answer).toLowerCase().includes(term)));
 document.getElementById("count").textContent=`显示 ${rs.length} 道`;
 document.getElementById("tb").innerHTML=rs.map(r=>`<tr class="${r.status==="排除"?"ex":""}"><td class="n">${r.no}</td><td class="t">${esc(r.category)}${r.status==="排除"?' <span class="tag" title="'+esc(r.exclude_reason)+'">排除</span>':""}</td><td class="t">${r.tier}</td><td class="t">${r.scales}</td><td class="t">${r.lang}</td><td class="q">${cellQ(r)}</td><td class="ans">${esc(r.answer)}</td><td class="t">${r.gold_docs}</td></tr>`).join("");
 chips("f-cat","category",uniq("category"));chips("f-lang","lang",uniq("lang"));chips("f-status","status",uniq("status"));
}
document.body.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const s=F[b.dataset.k],v=b.dataset.v;
 if(!s.size){uniq(b.dataset.k==="category"?"category":b.dataset.k).forEach(x=>{if(x!==v)s.add(x)});} else if(s.has(v)){s.delete(v);} else {s.add(v);}
 if(s.size===uniq(b.dataset.k).length)s.clear(); render();});
document.getElementById("q").addEventListener("input",render);render();
</script></body></html>
